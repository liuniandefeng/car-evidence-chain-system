<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 易通达发票订单管理系统</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #1a1a2e;
    background: url('login-bg.png') no-repeat center center / cover;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .login-wrap {
    width: min(420px, 90vw);
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .top-brand {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 14px;
    margin-left: -84px;
  }

  .top-brand img {
    height: 56px;
    width: auto;
    flex-shrink: 0;
  }

  .top-brand .brand-title {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.2;
    color: #1a2b4c;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(255, 255, 255, 0.6);
  }

  .login-card {
    width: min(420px, 90vw);
    background: rgba(255, 255, 255, 0.88);
    border-radius: 18px;
    padding: 40px 36px;
    box-shadow: 0 20px 60px rgba(22, 45, 90, 0.18);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .login-title {
    font-size: 22px;
    font-weight: 700;
    color: #1a2b4c;
    text-align: center;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #334155;
  }

  .form-group input {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    font-size: 15px;
    color: #1a1a2e;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-group input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }

  .form-group input::placeholder {
    color: #94a3b8;
  }

  .btn-login {
    width: 100%;
    height: 48px;
    margin-top: 8px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
  }

  .btn-login:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(37, 99, 235, 0.32);
  }

  .btn-login:active {
    transform: translateY(0);
  }

  .login-error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    animation: shake 0.4s ease-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="top-brand">
    <img src="logo.png" alt="logo">
    <span class="brand-title">易通达发票订单管理系统</span>
  </div>

  <div class="login-card">
    <h2 class="login-title">登录账户</h2>

  <form id="login-form" autocomplete="on" novalidate>
    <div class="form-group">
      <label for="username">账号</label>
      <input type="text" id="username" placeholder="请输入账号" autocomplete="username" required>
    </div>

    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-login">登 录</button>
  </form>
  </div>
</div>

<script>
(function() {
  const loginForm = document.getElementById('login-form');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const uname = usernameInput.value.trim();
    const pwd = passwordInput.value.trim();

    if (!uname) {
      usernameInput.focus();
      return;
    }
    if (!pwd) {
      passwordInput.focus();
      return;
    }

    /* Validate credentials: admin / 123456 */
    if (uname !== 'admin' || pwd !== '123456') {
      showLoginError('用户名或密码错误，请重试');
      return;
    }

    localStorage.setItem('car_user', JSON.stringify({ name: 'admin', role: '管理员', ts: Date.now() }));
    window.location.href = 'system.html';
  });

  function showLoginError(msg) {
    const old = document.querySelector('.login-error');
    if (old) old.remove();

    const errorEl = document.createElement('div');
    errorEl.className = 'login-error';
    errorEl.textContent = msg;
    loginForm.insertBefore(errorEl, loginForm.querySelector('.btn-login'));

    loginForm.style.animation = 'none';
    loginForm.offsetHeight; // reflow
    loginForm.style.animation = 'shake 0.4s ease-out';

    setTimeout(() => {
      if (errorEl.parentNode) errorEl.remove();
    }, 3000);
  }
})();
</script>
</body>
</html>
